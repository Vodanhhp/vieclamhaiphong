/* HIỂN THỊ DANH SÁCH VIỆC LÀM */
function renderJobs(jobs) {

    jobCount.textContent = "Tìm thấy " + jobs.length + " việc làm";

    if (jobs.length === 0) {
        jobList.innerHTML =
            "<p>Không tìm thấy việc làm phù hợp. Bạn hãy thử từ khóa khác.</p>";
        return;
    }

    jobList.innerHTML = jobs.map(row => `
        <div class="job">

            <h3>${escapeHTML(row[1])}</h3>

<div class="job-status">
    ${
        String(row[10] || "").toLowerCase().includes("đã hết hạn")
            ? '<span class="status-expired">Đã hết hạn</span>'
            : String(row[10] || "").toLowerCase().includes("đã kiểm tra thông tin cơ bản")
                ? '<span class="status-verified">✓ Đã kiểm tra thông tin</span>'
                : String(row[10] || "").toLowerCase().includes("đã xác minh")
                    ? '<span class="status-verified">✓ Đã xác minh</span>'
                    : '<span class="status-pending">Chưa xác minh</span>'
    }
</div>

            <p>🏢 Công ty: ${escapeHTML(row[2])}</p>

            <p>📍 Khu vực: ${escapeHTML(row[3])}</p>

            <p class="salary">
                💰 Lương: ${escapeHTML(row[4] || "Chưa cập nhật")}
            </p>

            <details>
                <summary>Xem chi tiết công việc ▼</summary>

                <div class="detail">

                    <p>${escapeHTML(row[5])}</p>

                    <p><strong>Yêu cầu:</strong> ${escapeHTML(row[6])}</p>

                    <p><strong>Hạn nộp:</strong> ${escapeHTML(row[7])}</p>

                    <p><strong>Ngày cập nhật:</strong> ${escapeHTML(row[9])}</p>

                    <p><strong>Trạng thái:</strong>
    ${
        String(row[10] || "").toLowerCase().includes("hết hạn")
            ? '<span class="status-expired">Đã hết hạn</span>'
            : String(row[10] || "").toLowerCase().includes("đã kiểm tra thông tin cơ bản")
                ? '<span class="status-verified">✓ Đã kiểm tra thông tin</span>'
                : String(row[10] || "").toLowerCase().includes("đã xác minh")
                    ? '<span class="status-verified">✓ Đã xác minh</span>'
                    : '<span class="status-pending">Chưa xác minh</span>'
    }
</p>
  

                    ${row[8]
                        ? `<p><a href="${escapeHTML(row[8])}" target="_blank" rel="noopener noreferrer">Xem tin tuyển dụng gốc ↗</a></p>`
                        : ""
                    }

                </div>
            </details>

        </div>
    `).join("");
}

fetch(sheetURL)

        if (!response.ok) {
            throw new Error("Không tải được dữ liệu");
        }
        return response.json();
    })
    .then(data => {
        displayJobs(data);
    })
    .catch(error => {
        jobList.innerHTML =
            "<p>Chưa kết nối được dữ liệu. Vui lòng thử lại sau.</p>";

        jobCount.textContent = "";

        console.error("Lỗi tải dữ liệu:", error);
    });
