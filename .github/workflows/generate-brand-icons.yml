name: Generate 247 brand icons

on:
  push:
    paths:
      - ".github/workflows/generate-brand-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate PNG and ICO icon set
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          GREEN = "#176B5C"
          MINT = "#B9D1C8"
          WHITE = "#FFFFFF"
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          def make_icon(size):
              im = Image.new("RGBA", (size, size), GREEN)
              d = ImageDraw.Draw(im)
              # Rounded-square background and fine mint border
              radius = round(size * 0.22)
              d.rounded_rectangle((1, 1, size-2, size-2), radius=radius,
                                  fill=GREEN, outline=MINT, width=max(1, round(size*0.018)))
              # Compact 24/7 monogram, matching the master SVG palette
              f = ImageFont.truetype(font_path, max(8, round(size*0.49)))
              f7 = ImageFont.truetype(font_path, max(8, round(size*0.49)))
              box24 = d.textbbox((0, 0), "24", font=f)
              box7 = d.textbbox((0, 0), "7", font=f7)
              w24 = box24[2] - box24[0]
              w7 = box7[2] - box7[0]
              gap = max(0, round(size*0.005))
              total = w24 + gap + w7
              x = (size-total)//2
              y24 = (size-(box24[3]-box24[1]))//2 - box24[1]
              y7 = (size-(box7[3]-box7[1]))//2 - box7[1]
              d.text((x, y24), "24", font=f, fill=WHITE, stroke_width=0)
              d.text((x+w24+gap, y7), "7", font=f7, fill=MINT, stroke_width=0)
              return im

          for n in (16, 32, 48, 180, 192, 512):
              make_icon(n).save(f"icon-{n}.png", optimize=True)

          # Standard filenames used by browsers and Apple devices
          make_icon(16).save("favicon-16x16.png", optimize=True)
          make_icon(32).save("favicon-32x32.png", optimize=True)
          make_icon(48).save("favicon-48x48.png", optimize=True)
          make_icon(180).save("apple-touch-icon.png", optimize=True)
          make_icon(192).save("android-chrome-192x192.png", optimize=True)
          make_icon(512).save("android-chrome-512x512.png", optimize=True)
          make_icon(48).save("favicon.ico", format="ICO",
                             sizes=[(16,16), (32,32), (48,48)])
          PY
      - name: Commit generated icon files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon-16x16.png favicon-32x32.png favicon-48x48.png favicon.ico apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png
          git commit -m "Replace legacy favicon and app icons with 247 brand set" || exit 0
          git push
